name: Autonomous Gatekeeper & Quality Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      task:
        description: "Architectural task to run through the 7-Agent Master Suite"
        required: false
        default: "Architect zero-downtime database migration to multi-region Aurora Global Database with SOC2 compliance"

permissions:
  contents: read
  pull-requests: write
  statuses: write
  issues: write

jobs:
  detect-changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      finops: ${{ steps.filter.outputs.finops }}
      agents: ${{ steps.filter.outputs.agents }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      iac: ${{ steps.filter.outputs.iac }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.pull_request.base.ref || 'main' }}
          filters: |
            scripts:
              - '**/*.sh'
              - 'scripts/**'
              - '!skills/csp/**'
              - '.github/workflows/autonomous-gatekeeper.yml'
            finops:
              - 'skills/finops/**'
              - '.github/workflows/autonomous-gatekeeper.yml'
            agents:
              - 'agents/**'
              - 'scripts/agents/**'
              - '.github/workflows/autonomous-gatekeeper.yml'
            docs_only:
              - 'docs/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'CONTRIBUTORS.md'
              - 'mkdocs.yml'
            iac:
              - '**/*.tf'
              - '**/*.tfvars'
              - '**/*.bicep'
              - '**/k8s/**'
              - '**/kubernetes/**'
              - '**/helm/**'
              - '**/charts/**'
              - '!skills/csp/**'

  validate-repo:
    name: Repository Hygiene & Skill Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Repository Validator
        run: python3 scripts/ci/validate_repo.py

  deterministic-preflight:
    name: Deterministic Pre-Flight Gate (ocagents preflight)
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pre-Flight Linters & Scanners
        env:
          NEEDS_IAC: ${{ needs.detect-changes.outputs.iac }}
          TARGET_BASE_REF: ${{ github.base_ref || 'main' }}
          RUFF_VERSION: "0.17.4"
          CHECKOV_VERSION: "3.2.368"
        run: |
          python3 -m pip install --upgrade pip
          pip install "ruff==${RUFF_VERSION}"
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          # Provision Checkov if IaC or Kubernetes manifests are modified in the target changeset
          TARGET_REF="${TARGET_BASE_REF:-main}"
          DIFF_REF="origin/${TARGET_REF}"
          if ! git rev-parse --verify "${DIFF_REF}" >/dev/null 2>&1; then
            DIFF_REF="${TARGET_REF}"
          fi
          if [ "$NEEDS_IAC" = "true" ] || git diff --name-only "${DIFF_REF}...HEAD" 2>/dev/null | grep -v '^skills/csp/' | grep -E '\.(tf|tfvars|bicep)$|(^|/)(k8s|kubernetes|helm|charts)/.*\.ya?ml$' >/dev/null; then
            echo "📦 IaC or Kubernetes manifests detected in changeset; provisioning required scanner: checkov==${CHECKOV_VERSION}..."
            pip install "checkov==${CHECKOV_VERSION}"
          fi

      - name: Execute Deterministic Pre-Flight Gate
        env:
          TARGET_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          echo "Executing ocagents preflight on target changeset against base ref: ${TARGET_BASE_REF}"
          set +e
          ./bin/ocagents preflight --diff "${TARGET_BASE_REF}" --json > preflight_report.json
          EXIT_CODE=$?
          set -e
          echo "Pre-flight engine exited with code: $EXIT_CODE"
          cat preflight_report.json

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ Deterministic pre-flight checks passed cleanly (exit 0)."
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "⚠️ Deterministic pre-flight completed with advisory findings or missing advisory scanners (exit 2)."
          else
            echo "❌ Deterministic pre-flight failed required checks (exit $EXIT_CODE)."
            exit "$EXIT_CODE"
          fi

      - name: Upload Pre-Flight Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: preflight-report
          path: preflight_report.json
          retention-days: 7

  validate-agent-specs:
    name: Agent Persona & Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate 7-Agent Master Suite Contracts
        run: python3 scripts/agents/agent_pipeline.py --validate

  run-agent-handoff-pipeline:
    name: Multi-Agent Handoff Pipeline Simulation
    needs: validate-agent-specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Execute 6-Stage Multi-Agent Handoff
        env:
          TASK_INPUT: ${{ github.event.inputs.task }}
        run: |
          if [ -z "$TASK_INPUT" ]; then
            python3 scripts/agents/agent_pipeline.py --simulate --export-json execution_trace.json
          else
            python3 scripts/agents/agent_pipeline.py --task "$TASK_INPUT" --export-json execution_trace.json
          fi

      - name: Upload Pipeline Execution Trace Artifact
        if: ${{ runner.name != 'Local Actions' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: agent-execution-trace
          path: execution_trace.json
          retention-days: 7

  secret-scan:
    name: Secret Leak Detection
    needs: detect-changes
    if: github.event_name == 'pull_request' || needs.detect-changes.outputs.docs_only != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.2"
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            GITLEAKS_ARCH="linux_arm64"
          else
            GITLEAKS_ARCH="linux_x64"
          fi
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${GITLEAKS_ARCH}.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_${GITLEAKS_ARCH}.tar.gz"
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Audit
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  shell-lint:
    name: Shell Script Syntax & Linting
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all Scripts
        run: |
          echo "Linting all shell scripts..."
          find . -name "*.sh" -not -path "*/.*" -not -path "./ai_brain/*" -not -path "./skills/csp/*" | while read -r script; do
            echo "Checking: $script"
            shellcheck --severity=warning -x "$script"
          done

  finops-waste-scan:
    name: FinOps Cloud Waste Reaper Regression
    needs: detect-changes
    if: needs.detect-changes.outputs.finops == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Execute Cloud Waste Reaper (Mock Mode)
        run: |
          ./skills/finops/cloud-waste-reaper/scripts/reap_cloud_waste.sh \
            --mock \
            --export-json /tmp/waste_report.json \
            --export-markdown /tmp/waste_report.md
          echo "=== Waste Report Preview ==="
          cat /tmp/waste_report.md

  autonomous-gatekeeper:
    name: Antigravity-AI Automated Pre-Merge Verification Summary
    if: always() && github.event_name == 'pull_request'
    needs:
      - detect-changes
      - validate-repo
      - deterministic-preflight
      - validate-agent-specs
      - run-agent-handoff-pipeline
      - secret-scan
      - shell-lint
      - finops-waste-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run DevSecOps Automated Review on Diff
        id: review
        env:
          TARGET_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          python3 scripts/ci/audit_pr_diff.py "${TARGET_BASE_REF}"

      - name: Evaluate Model Findings Triage Gate
        id: triage_gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          echo "Evaluating open-cloud-agents/triage-gate status check..."
          FINDINGS_ARG=""
          if [ -f "preflight_report.json" ]; then
            FINDINGS_ARG="--findings preflight_report.json"
          fi

          python3 -m ocagents triage gate $FINDINGS_ARG \
            --sha "$HEAD_SHA" \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --pr-author "$PR_AUTHOR" \
            --json > triage_gate_report.json 2>/dev/null || true

          cat triage_gate_report.json

      - name: Antigravity-AI Pre-Merge Verification Report
        uses: actions/github-script@v9
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // 1. Evaluate upstream job results
            const needs = JSON.parse(process.env.NEEDS_CONTEXT || '{}');
            const failedJobs = Object.entries(needs)
              .filter(([name, data]) => data.result === 'failure')
              .map(([name]) => name);

            // Fetch existing reviews to ensure idempotency
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // If any upstream verification check failed:
            if (failedJobs.length > 0) {
              const failureList = failedJobs.map(j => `- ❌ \`${j}\` failed`).join('\n');
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'COMMENT',
                body: `### 🤖 Antigravity-AI: Pre-Merge Verification Blocked\n\n**Verdict:** 🛑 Automated Quality Gates Failed\n\nThe following upstream CI checks failed and must be resolved before maintainer review:\n${failureList}\n\n> *Please resolve the failing checks and re-push.*`
              });
              console.log('🛑 Submitted failure comment due to upstream job failures: ' + failedJobs.join(', '));
              core.setFailed('Upstream quality gate checks failed: ' + failedJobs.join(', '));
              return;
            }

            // 2. Evaluate Triage Gate status report
            let triageGatePending = false;
            let triageGateDesc = 'zero unresolved P0/P1 findings';
            let triageGateLine = '- ✅ **Model Findings Triage Gate (`open-cloud-agents/triage-gate`):** Passed (zero unresolved P0/P1 assertions)';
            if (fs.existsSync('triage_gate_report.json')) {
              try {
                const report = JSON.parse(fs.readFileSync('triage_gate_report.json', 'utf8'));
                if (report.is_blocking || report.status === 'pending') {
                  triageGatePending = true;
                  triageGateDesc = report.description || 'Unresolved P0/P1 model assertions require human maintainer sign-off';
                  triageGateLine = `- ⏳ **Model Findings Triage Gate (\`open-cloud-agents/triage-gate\`):** Pending (${triageGateDesc})`;
                } else {
                  triageGateDesc = report.description || 'zero unresolved P0/P1 findings';
                  triageGateLine = `- ✅ **Model Findings Triage Gate (\`open-cloud-agents/triage-gate\`):** Passed (${triageGateDesc})`;
                }
              } catch (e) {
                console.warn('Could not parse triage_gate_report.json:', e);
              }
            }

            // Sync commit status context: open-cloud-agents/triage-gate
            const headSha = context.payload.pull_request ? context.payload.pull_request.head.sha : null;
            if (headSha) {
              const gateState = triageGatePending ? 'pending' : 'success';
              try {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: headSha,
                  state: gateState,
                  context: 'open-cloud-agents/triage-gate',
                  description: triageGateDesc.substring(0, 140)
                });
                console.log(`Synced commit status for open-cloud-agents/triage-gate: ${gateState}`);
              } catch (err) {
                console.warn(`Could not set commit status: ${err.message}`);
              }

              // Apply or remove PR label: needs-security-review
              if (triageGatePending) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    labels: ['needs-security-review']
                  });
                  console.log("Applied label 'needs-security-review' to PR #" + context.issue.number);
                } catch (err) {
                  console.warn(`Could not add label: ${err.message}`);
                }

                // Request review from CODEOWNERS if not PR author
                const prAuthor = context.payload.pull_request.user.login;
                if (prAuthor !== 'ibrahimng') {
                  try {
                    await github.rest.pulls.requestReviewers({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: context.issue.number,
                      reviewers: ['ibrahimng']
                    });
                    console.log('Requested review from CODEOWNERS (@ibrahimng)');
                  } catch (err) {
                    console.warn(`Could not request review from CODEOWNERS: ${err.message}`);
                  }
                }
              } else {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    name: 'needs-security-review'
                  });
                  console.log("Removed label 'needs-security-review' from PR #" + context.issue.number);
                } catch (err) {
                  // HTTP 404 is normal if label was not attached
                }
              }
            }

            // 3. Evaluate DevSecOps diff audit results
            const summary = fs.existsSync('pr_review.md')
              ? fs.readFileSync('pr_review.md', 'utf8')
              : 'Audit summary not found.';
            const verdict = fs.existsSync('pr_verdict.txt')
              ? fs.readFileSync('pr_verdict.txt', 'utf8').trim()
              : '';
            const isClean = verdict === 'CLEAN' || (summary.includes('Clean') && !summary.includes('Needs Human Review'));

            if (isClean) {
              const alreadyReviewed = reviews.some(
                r => r.user.login === 'github-actions[bot]' && (r.body && r.body.includes('Antigravity-AI: Pre-Merge Quality Gate Verification'))
              );

              if (!alreadyReviewed) {
                const footerText = '> *Automated verification by Antigravity-AI pre-merge pipeline. Automated checks assist reviewers; formal pull request approval requires a human maintainer.*';

                const gateDefinitions = [
                  { id: 'validate-repo', name: 'Repository Hygiene & Skill Specs', desc: 'Metadata headers, shell permissions, link integrity' },
                  { id: 'deterministic-preflight', name: 'Deterministic Pre-Flight Gate (ocagents preflight)', desc: 'Fail-closed availability protocol, signed exceptions, OPA invariants' },
                  { id: 'secret-scan', name: 'Secret Leak Detection (Gitleaks)', desc: 'Scan for plaintext credentials and private keys' },
                  { id: 'validate-agent-specs', name: 'Agent Persona & Specification Validation', desc: '7-Agent Master Suite structure and token budgets' },
                  { id: 'run-agent-handoff-pipeline', name: 'Multi-Agent Pipeline Simulation', desc: '6-stage handoff execution and trace artifact' },
                  { id: 'shell-lint', name: 'Shell Script Syntax & Linting (ShellCheck)', desc: 'ShellCheck static analysis on shell scripts' },
                  { id: 'finops-waste-scan', name: 'FinOps Cloud Waste Reaper Regression', desc: 'Waste Reaper cost optimization regression scan' }
                ];

                const gateLines = gateDefinitions.map(g => {
                  const jobResult = needs[g.id] ? needs[g.id].result : 'skipped';
                  if (jobResult === 'success') {
                    return `- ✅ **${g.name}:** Passed (${g.desc})`;
                  } else if (jobResult === 'skipped') {
                    return `- ⏭️ **${g.name}:** Skipped (conditional: no applicable file changes detected)`;
                  } else {
                    return `- ⚠️ **${g.name}:** ${jobResult}`;
                  }
                });
                gateLines.push('- ✅ **DevSecOps Diff Heuristic Screen:** Passed (no literal high-risk strings: force_destroy, forces replacement, 0.0.0.0/0 ingress, chmod 777)');
                gateLines.push(triageGateLine);

                const verdictHeading = triageGatePending
                  ? '**Verdict:** ⏳ All Applicable Pre-Merge Quality Gates Passed - Awaiting Human Maintainer Sign-Off (open-cloud-agents/triage-gate: PENDING)\n\n'
                  : '**Verdict:** ✅ All Applicable Pre-Merge Quality Gates Passed (Awaiting Human Maintainer Review)\n\n';

                const verificationBody = `### 🤖 Antigravity-AI: Pre-Merge Quality Gate Verification\n\n` +
                  verdictHeading +
                  `#### Pre-Merge Quality Gate Status:\n` +
                  gateLines.join('\n') + `\n\n` +
                  `${summary}\n\n` +
                  `${footerText}`;

                // Non-approving verification comment (event: 'COMMENT' across all PRs; human review required)
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  event: 'COMMENT',
                  body: verificationBody
                });
                console.log('✅ Submitted automated verification comment as Antigravity-AI.');
              } else {
                console.log('ℹ️ PR already verified by Antigravity-AI.');
              }
            } else {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'COMMENT',
                body: `### 🤖 Antigravity-AI: DevSecOps Review Findings\n\n${summary}\n\n> *⚠️ Human review required before merge.*`
              });
              console.log('⚠️ Submitted findings comment due to flagged items.');
              core.setFailed('DevSecOps Reviewer flagged potential security/IaC risks.');
            }

