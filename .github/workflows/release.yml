name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-binaries:
    name: Build Standalone Binary (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: darwin
            arch: arm64
            runner: macos-latest
            binary_name: ocagents-darwin-arm64
            archive_name: ocagents-darwin-arm64.tar.gz
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            binary_name: ocagents-linux-amd64
            archive_name: ocagents-linux-amd64.tar.gz
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            binary_name: ocagents-linux-arm64
            archive_name: ocagents-linux-arm64.tar.gz
          - os: windows
            arch: amd64
            runner: windows-latest
            binary_name: ocagents-windows-amd64.exe
            archive_name: ocagents-windows-amd64.zip

    steps:
      - name: Enable Windows Long Paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyyaml

      - name: Compile Hermetic Executable (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller packaging/pyinstaller/ocagents.spec
          chmod +x dist/ocagents/ocagents dist/ocagents-onefile
          tar -czf "dist/${{ matrix.target.archive_name }}" -C dist/ocagents .
          cp dist/ocagents-onefile "dist/${{ matrix.target.binary_name }}"
          if [ "${{ matrix.target.os }}" = "darwin" ]; then
            tar -czf "dist/ocagents-darwin-amd64.tar.gz" -C dist/ocagents .
            cp dist/ocagents-onefile "dist/ocagents-darwin-amd64"
          fi
          cd dist
          for f in *.tar.gz ocagents-*; do
            if [ -f "$f" ] && [[ ! "$f" =~ \.sha256$ ]] && [ "$f" != "ocagents" ] && [ "$f" != "ocagents-onefile" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "$f.sha256"
              else
                shasum -a 256 "$f" > "$f.sha256"
              fi
            fi
          done

      - name: Compile Hermetic Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller packaging/pyinstaller/ocagents.spec
          Compress-Archive -Path dist\ocagents\* -DestinationPath "dist\${{ matrix.target.archive_name }}" -Force
          Copy-Item dist\ocagents-onefile.exe "dist\${{ matrix.target.binary_name }}" -Force
          Set-Location dist
          $hashArchive = (Get-FileHash -Algorithm SHA256 "${{ matrix.target.archive_name }}").Hash.ToLower()
          "$hashArchive  ${{ matrix.target.archive_name }}" | Out-File -Encoding ASCII -FilePath "${{ matrix.target.archive_name }}.sha256"
          $hashBin = (Get-FileHash -Algorithm SHA256 "${{ matrix.target.binary_name }}").Hash.ToLower()
          "$hashBin  ${{ matrix.target.binary_name }}" | Out-File -Encoding ASCII -FilePath "${{ matrix.target.binary_name }}.sha256"

      - name: Generate Build Provenance Attestation
        if: ${{ runner.name != 'Local Actions' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/ocagents-*

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target.binary_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/ocagents-*
            dist/*.sha256
          retention-days: 2

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    if: always() && (needs.build-binaries.result == 'success' || needs.build-binaries.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine Target Tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        run: |
          python3 -c "
          import re, os
          target_tag = '${{ steps.tag.outputs.version }}'.lstrip('v')
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(target_tag)}\][^\n]*\n(.*?)(?=\n## |\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = f'Release ${{ steps.tag.outputs.version }}'
          with open('release_notes.md', 'w') as f:
              f.write(notes)
          "

      - name: Download Compiled Binaries
        if: ${{ runner.name != 'Local Actions' }}
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: release_assets

      - name: Consolidate Checksums
        if: ${{ runner.name != 'Local Actions' }}
        run: |
          if [ -d release_assets ]; then
            cat release_assets/*.sha256 > release_assets/checksums.txt 2>/dev/null || true
            rm -f release_assets/*.sha256
            ls -la release_assets/
          fi

      - name: Generate Consolidated Release Provenance Attestation
        if: ${{ runner.name != 'Local Actions' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release_assets/*

      - name: Preview Release Notes (Local act mode)
        if: ${{ runner.name == 'Local Actions' }}
        run: |
          echo "Running in local act runner. Skipping live GitHub API release call."
          echo "=== Extracted Release Notes Preview ==="
          cat release_notes.md
          echo "======================================"

      - name: Publish GitHub Release
        if: ${{ runner.name != 'Local Actions' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Open Cloud Agents ${{ steps.tag.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: release_assets/*

      - name: Trigger Homebrew Tap Formula Update
        if: ${{ runner.name != 'Local Actions' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.RELEASE_AUTOMATION_TOKEN || secrets.GH_PAT || github.token }}
          TARGET_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          echo "Dispatching formula update to open-cloud-agents/homebrew-tap for release $TARGET_VERSION..."
          if GH_TOKEN="$DISPATCH_TOKEN" gh workflow run update-formula.yml --repo open-cloud-agents/homebrew-tap -f version="$TARGET_VERSION" 2>/dev/null; then
            echo "✔ Successfully triggered update-formula.yml in open-cloud-agents/homebrew-tap."
          elif GH_TOKEN="$DISPATCH_TOKEN" gh api repos/open-cloud-agents/homebrew-tap/dispatches -f event_type=ocagents-released -f client_payload[version]="$TARGET_VERSION" 2>/dev/null; then
            echo "✔ Successfully dispatched repository event to open-cloud-agents/homebrew-tap."
          else
            echo "ℹ Notice: Cross-repository dispatch requires HOMEBREW_TAP_TOKEN secret (PAT with Actions:Write on open-cloud-agents/homebrew-tap)."
            echo "  The scheduled sync in homebrew-tap or manual workflow_dispatch will automatically synchronize the formula."
          fi
