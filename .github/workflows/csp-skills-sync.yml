name: CSP Skills Daily Upstream Monitor

on:
  schedule:
    # Runs daily at 04:00 AM EET (02:00 AM UTC)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force full content re-synchronization even if up to date"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  csp-drift-monitor:
    name: Monitor & Synchronize Upstream CSP Skills (AWS, Azure, GCP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Upstream CSP Synchronization
        id: sync_content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_SYNC: ${{ github.event.inputs.force_sync }}
        run: |
          EXTRA_FLAGS=""
          if [ "$FORCE_SYNC" = "true" ]; then
            EXTRA_FLAGS="--force"
          fi

          python3 scripts/ci/sync_csp_content.py \
            --markdown-summary /tmp/csp_summary.md \
            $EXTRA_FLAGS

          # Cat to GitHub Step Summary
          cat /tmp/csp_summary.md >> "$GITHUB_STEP_SUMMARY"

          # Check if any files in skills/csp were updated, added, or deleted
          if git status --porcelain | grep -q "skills/csp/"; then
            echo "DRIFT_FOUND=true" >> "$GITHUB_ENV"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "DRIFT_FOUND=false" >> "$GITHUB_ENV"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Repository Hygiene
        if: env.DRIFT_FOUND == 'true'
        run: |
          python3 scripts/ci/validate_repo.py
          python3 scripts/agents/agent_pipeline.py --validate

      - name: Create Pull Request on Upstream Drift
        if: env.DRIFT_FOUND == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(csp): synchronize upstream CSP skills and baseline

            Signed-off-by: Ibrahim Jimoh <Ibrahimng@users.noreply.github.com>
            Co-authored-by: Antigravity <antigravity@google.com>
          committer: GitHub Actions <actions@github.com>
          author: Ibrahim Jimoh <Ibrahimng@users.noreply.github.com>
          branch: automated/csp-skills-sync
          title: "chore(csp): sync upstream Cloud Service Provider (CSP) skills"
          body-path: /tmp/csp_summary.md
          labels: |
            automated
            dependencies
            csp-sync
          assignees: |
            Ibrahimng
          delete-branch: true

      - name: Auto-Resolve Open Alert Issues on Success
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const openAlerts = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'csp-sync,automated-audit'
            });

            for (const issue of openAlerts.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **Automated Resolution:** The Daily CSP Upstream Monitor succeeded cleanly in run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Closing issue automatically.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

      - name: Notify Maintainer on Monitor Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🚨 Daily CSP Monitor Alert: Upstream Check Failure [${new Date().toISOString().split('T')[0]}]`;
            const body = `### ⚠️ Daily CSP Upstream Monitor Failure\n\nThe scheduled CSP skills drift monitor at **04:00 AM EET (02:00 AM UTC)** encountered an unexpected failure.\n\n- **Run URL:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Commit:** ${context.sha}\n\ncc: @ibrahimng please investigate the workflow execution log.`;
            
            // Deduplicate: check if an open alert issue already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'csp-sync,automated-audit'
            });

            if (existingIssues.data.length > 0) {
              const activeIssue = existingIssues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: activeIssue.number,
                body: `**Recurring Failure Update [${new Date().toISOString().split('T')[0]}]:**\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'automated-audit', 'csp-sync']
              });
            }

