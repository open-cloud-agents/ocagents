apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
        - name: processor
          image: internal-registry.corp/payments:v1.2.0
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
