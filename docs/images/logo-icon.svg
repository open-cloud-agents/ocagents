<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>

    <!-- Cyan-to-Blue Primary Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00c0fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Indigo-Violet Secondary Gradient -->
    <linearGradient id="blueViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Emerald Security Accent -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Icon Container (Rounded Hex-Squircle) -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2.5"/>

  <!-- Geometric Constellation Network (7 Nodes forming Cloud & Shield) -->
  <g filter="url(#softShadow)" transform="translate(0, 4)">
    
    <!-- Outer Shield / Cloud Facet Paths -->
    <path d="M 128 42 L 186 78 L 204 138 L 174 196 L 128 214 L 82 196 L 52 138 L 70 78 Z" 
          fill="none" stroke="#21262d" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Interconnecting Agent Circuit Lines -->
    <!-- Top to Left & Right -->
    <line x1="128" y1="52" x2="74" y2="92" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round"/>
    <line x1="128" y1="52" x2="182" y2="92" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round"/>

    <!-- Left to Center Core & Bottom Left -->
    <line x1="74" y1="92" x2="128" y2="128" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round"/>
    <line x1="74" y1="92" x2="60" y2="158" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round"/>

    <!-- Right to Center Core & Bottom Right -->
    <line x1="182" y1="92" x2="128" y2="128" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round"/>
    <line x1="182" y1="92" x2="196" y2="158" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round"/>

    <!-- Center Core to Bottom Flanks & Base -->
    <line x1="128" y1="128" x2="60" y2="158" stroke="url(#blueViolet)" stroke-width="3" stroke-linecap="round"/>
    <line x1="128" y1="128" x2="196" y2="158" stroke="url(#blueViolet)" stroke-width="3" stroke-linecap="round"/>
    <line x1="128" y1="128" x2="128" y2="198" stroke="url(#blueViolet)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bottom Flanks to Base Anchor -->
    <line x1="60" y1="158" x2="128" y2="198" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round"/>
    <line x1="196" y1="158" x2="128" y2="198" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round"/>

    <!-- Translucent Cloud Arch (Overlay Accent) -->
    <path d="M 64 160 C 50 160, 44 140, 56 128 C 50 110, 68 86, 92 90 C 104 68, 148 64, 164 88 C 182 82, 204 100, 200 122 C 214 134, 208 160, 192 160 Z" 
          fill="url(#cyanBlue)" fill-opacity="0.08" stroke="url(#cyanBlue)" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- The 7 Master Suite Nodes -->
    
    <!-- 1. Principal Cloud Architect (Summit Node) -->
    <circle cx="128" cy="52" r="9" fill="#0d1117" stroke="url(#cyanBlue)" stroke-width="3.5"/>
    <circle cx="128" cy="52" r="4.5" fill="#00f2fe"/>

    <!-- 2. Security Compliance Commander (Upper Left) -->
    <circle cx="74" cy="92" r="8" fill="#0d1117" stroke="url(#emeraldGlow)" stroke-width="3"/>
    <circle cx="74" cy="92" r="3.5" fill="#34d399"/>

    <!-- 3. FinOps Cost Optimizer (Upper Right) -->
    <circle cx="182" cy="92" r="8" fill="#0d1117" stroke="url(#cyanBlue)" stroke-width="3"/>
    <circle cx="182" cy="92" r="3.5" fill="#38bdf8"/>

    <!-- 4. DevSecOps Reviewer (Center Core Engine) -->
    <circle cx="128" cy="128" r="14" fill="#0d1117" stroke="url(#cyanBlue)" stroke-width="4" filter="url(#coreGlow)"/>
    <circle cx="128" cy="128" r="6.5" fill="url(#cyanBlue)"/>

    <!-- 5. DevSecOps Engineer (Lower Left) -->
    <circle cx="60" cy="158" r="8" fill="#0d1117" stroke="url(#cyanBlue)" stroke-width="3"/>
    <circle cx="60" cy="158" r="3.5" fill="#38bdf8"/>

    <!-- 6. GitOps Release Manager (Lower Right) -->
    <circle cx="196" cy="158" r="8" fill="#0d1117" stroke="url(#blueViolet)" stroke-width="3"/>
    <circle cx="196" cy="158" r="3.5" fill="#818cf8"/>

    <!-- 7. SRE Reliability Incident Commander (Foundation Base) -->
    <circle cx="128" cy="198" r="9" fill="#0d1117" stroke="url(#cyanBlue)" stroke-width="3.5"/>
    <circle cx="128" cy="198" r="4.5" fill="#00f2fe"/>
  </g>
</svg>
