apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-cache
  namespace: demo-billing
  labels:
    app: billing-cache
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-cache
  template:
    metadata:
      labels:
        app: billing-cache
        tier: cache
    spec:
      containers:
        - name: cache
          image: python:3.11-alpine
          # INJECTED DEFECT: Allocates 30MiB while memory limit is capped at 16MiB (OOMKilled - Exit Code 137)
          command:
            - "sh"
            - "-c"
            - "python3 -c 'a = bytearray(30 * 1024 * 1024); import time; time.sleep(600)'"
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 16Mi
