apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: demo-billing
  labels:
    app: billing-api
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-api
  template:
    metadata:
      labels:
        app: billing-api
        tier: api
    spec:
      containers:
        - name: api
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api-service
  namespace: demo-billing
  labels:
    app: billing-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  # INJECTED DEFECT: Mismatched label selector produces "Service has no endpoints" & HTTP 502
  selector:
    app: billing-api-v2
